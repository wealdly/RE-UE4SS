; Gothic 1 Remake — UE4SS-settings.ini
; Tuned for G1R (UE 5.4.3, Win64, DX12 Shipping, AngelScript + IoStore).
; Drop this file into the game's ue4ss/ directory alongside UE4SS.dll.
;
; Critical differences from upstream defaults are marked [G1R-REQUIRED].

[Overrides]
ModsFolderPath =
ControllingModsTxt =

[General]
; Hot-reload is useful during development but adds hook re-registration risk.
; Each CTRL+R re-registers keybinds/notifications without removing old ones;
; handlers fire once per reload. Disable in shipping installs.
EnableHotReloadSystem = 0
HotReloadKey = R
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 30

; bUseUObjectArrayCache = true is safe ONLY with the wealdly/UEPseudo g1r-compat
; guards (commit ffe5677+). Those guards skip partially-initialized objects in
; the create/delete listeners and searcher pools, and add a mutex around the
; global object cache. G1R's IoStore build creates objects on async loading
; threads during streaming zone transitions, which previously fired listener
; callbacks on partially-initialised objects (AV at startup or first zone load).
; If you are running a STOCK upstream UE4SS build, set this to false.
bUseUObjectArrayCache = true

DoEarlyScan = 0
bEnableSeachByMemoryAddress = false

; [G1R-REQUIRED] DefaultExecuteInGameThreadMethod = EngineTick
; ProcessEvent is the other option. EngineTick is safer for G1R because
; G1R's heavy AngelScript use means ProcessEvent fires extremely frequently
; (thousands of times per frame); coalescing deferred Lua work to EngineTick
; (once per frame) avoids thundering-herd pressure on the game thread.
DefaultExecuteInGameThreadMethod = EngineTick

DefaultFNameToStringMethod = Scan

[EngineVersionOverride]
MajorVersion =
MinorVersion =
; G1R is a Shipping build, not Debug/Development.
DebugBuild =

[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects = 0
UseModuleOffsets = 0

[CXXHeaderGenerator]
DumpOffsetsAndSizes = 1
KeepMemoryLayout = 0
LoadAllAssetsBeforeGeneratingCXXHeaders = 0

[UHTHeaderGenerator]
IgnoreAllCoreEngineModules = 0
IgnoreEngineAndCoreUObject = 0
MakeAllFunctionsBlueprintCallable = 1
MakeAllPropertyBlueprintsReadWrite = 1
MakeEnumClassesBlueprintType = 1
MakeAllConfigsEngineConfig = 1

[Debug]
; Disable all debug UI in shipping installs — reduces overhead and avoids
; the DX12/ImGui present-hook interaction with G1R's frame generation path.
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0
GuiConsoleFontScaling = 1
; opengl avoids any interaction with G1R's DX12+DLSS+FG present chain.
GraphicsAPI = opengl
; ExternalThread keeps GUI off the game thread entirely.
RenderMode = ExternalThread

[Threads]
SigScannerNumThreads = 8
SigScannerMultithreadingModuleSizeThreshold = 16777216

[Memory]
MaxMemoryUsageDuringAssetLoading = 80

[Hooks]
; Hooks marked = 0 below are detours that cost a trampoline call on EVERY
; invocation even with zero registered callbacks. G1R's AngelScript drives
; ProcessEvent at thousands of calls per frame, so dead detours are
; disproportionately expensive here. Re-enable a hook only if a mod actually
; registers the corresponding callback (UE4SS logs a warning naming the hook).
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1

; [G1R-REQUIRED] HookInitGameState = 1
; RegisterInitGameStatePostHook (the safe world-reset point for G1R mods)
; depends on this. Do not disable.
HookInitGameState = 1

; Used by BPModLoaderMod / AutoQuickSave (RegisterLoadMapPre/PostHook).
HookLoadMap = 1
; Only needed by RegisterConsoleCommand (console mods); console is disabled.
HookCallFunctionByNameWithArguments = 0
; Used by BPModLoaderMod (RegisterBeginPlayPostHook).
HookBeginPlay = 1
; No installed mod uses EndPlay hooks.
HookEndPlay = 0
; Console is disabled; exec hooks unused.
HookLocalPlayerExec = 0
; Fires per actor per frame; no installed mod uses it. Expensive on G1R.
HookAActorTick = 0
; Required: EngineTick is the game-thread dispatch point
; (DefaultExecuteInGameThreadMethod = EngineTick).
HookEngineTick = 1
EngineTickResolveMethod = Scan
; RenderMode is ExternalThread and dispatch is EngineTick; unused.
HookGameViewportClientTick = 0
; AngelScript drives ProcessEvent thousands of times per frame; no installed
; mod registers ProcessEvent pre/post hooks. Biggest single perf win.
HookUObjectProcessEvent = 0
; Console is disabled.
HookProcessConsoleExec = 0
; Required with bUseUObjectArrayCache = true: feeds searcher pools for
; classes linked after startup.
HookUStructLink = 1
FExecVTableOffsetInLocalPlayer = 0x28

[CrashDump]
EnableDumping = 1
FullMemoryDump = 0

[ExperimentalFeatures]
